# Configuración de Sveltia CMS — Public Document Hub
backend:
  name: github
  repo: Blueisazul/publidoc
  branch: main
  base_url: https://autumn-silence-2cb3.sabinorthr.workers.dev

# Gestión de medios estáticos
media_folder: "public/uploads"
public_folder: "/uploads"

# Colecciones documentales
collections:
  - name: "categories"
    label: "Categorías"
    label_singular: "Categoría"
    folder: "src/content/categories"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}} (Orden: {{order}})"
    sortable_fields:
      - "order"
      - "name"
    fields:
      - label: "Nombre de Categoría"
        name: "name"
        widget: "string"
        required: true

      - label: "Descripción"
        name: "description"
        widget: "text"
        required: false

      - label: "Orden de visualización"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1
        required: true

  - name: "docs"
    label: "Documentos"
    label_singular: "Documento"
    folder: "src/content/docs"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    # Identificador inmutable UUID v4 generado automáticamente y no editable
    slug:
      template: "{{uuid}}"
      editable: false
    summary: "{{title}} ({{updatedAt}})"
    sortable_fields:
      - "updatedAt"
      - "title"
      - "createdAt"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        required: true

      - label: "Categoría"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: true

      - label: "Descripción"
        name: "description"
        widget: "text"
        required: false

      - label: "Fecha de creación"
        name: "createdAt"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        picker_utc: true
        required: true

      - label: "Fecha de actualización"
        name: "updatedAt"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        picker_utc: true
        required: true

      - label: "Contenido Markdown"
        name: "body"
        widget: "markdown"
        modes:
          - "raw"
          - "rich_text"
        required: true
